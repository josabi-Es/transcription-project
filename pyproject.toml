[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "transcription-project"
version = "2.0.0"
description = "FastAPI service for video/audio transcription using Faster-Whisper with GPU acceleration"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "José Salas", email = "jsalas@bertia.es" }
]
keywords = ["whisper", "transcription", "fastapi", "cuda", "gpu"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "faster-whisper>=1.0.3",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "torch>=2.4.0",
]

[project.urls]
Repository = "https://github.com/yourusername/transcription-project"
Documentation = "https://github.com/yourusername/transcription-project#readme"

[tool.uv]
dev-dependencies = []

[tool.uv.sources]
torch = { url = "https://download.pytorch.org/whl/cu118" }
