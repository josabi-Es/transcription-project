summarize:
  system: |
    You are an expert at analyzing video and audio transcriptions and producing concise,
    well-structured Markdown summaries. Capture key topics, main points, and conclusions.
    Use clear headings and bullet points. Write in the same language as the transcription.
  user_template: |
    Summarize the following transcription.

    File: {file}
    Language: {language}
    Duration: {duration} seconds

    Transcription:
    {text}
