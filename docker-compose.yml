services:
  transcriber:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./storage/models:/app/storage/models
      - ./storage/input:/app/storage/input
      - ./storage/output:/app/storage/output
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
