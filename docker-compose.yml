version: '3.8'

services:
  transcriber:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: transcription-service
    ports:
      - "8000:8000"
    environment:
      - WHISPER_MODEL=tiny
      - PYTHONUNBUFFERED=1
    volumes:
      - ./models:/app/models
      - /tmp:/tmp
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
