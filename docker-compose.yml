services:
  transcriber:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      - ./storage/models:/app/storage/models
      - ./storage/input:/app/storage/input
      - ./storage/output:/app/storage/output
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ui:
    build:
      context: .
      dockerfile: docker/ui.Dockerfile
    ports:
      - "${UI_PORT:-8501}:8501"
    environment:
      BACKEND_URL: http://transcriber:8000
    depends_on:
      - transcriber
    restart: unless-stopped
